<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radiance Cascades WGSL - Real-Time Global Illumination Demo</title>
  <style>
    :root {
      --bg: #030712;
      --panel: rgba(10, 15, 30, 0.85);
      --border: rgba(0, 240, 255, 0.3);
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-green: #00ff88;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    .hud {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    .hud-header {
      top: 24px;
      left: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: 8px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 240, 255, 0.1);
      pointer-events: auto;
    }

    .hud-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--neon-cyan);
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 255, 136, 0.15);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      font-weight: 600;
    }

    .hud-subtitle {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .hud-controls {
      top: 24px;
      right: 28px;
      width: 320px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 8px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .control-val {
      color: var(--neon-cyan);
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--neon-cyan);
      cursor: pointer;
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 8px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 12px var(--neon-cyan);
    }

    .hud-footer {
      bottom: 24px;
      left: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 6px;
      display: flex;
      gap: 24px;
      font-size: 11px;
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }

    .telemetry-item span {
      color: var(--neon-green);
      font-weight: 700;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hud hud-header">
    <div class="hud-title">
      RADIANCE-CASCADES-WGSL
      <span class="badge">60 FPS GI</span>
    </div>
    <div class="hud-subtitle">Hierarchical Interval Raymarching & Merging</div>
  </div>

  <div class="hud hud-controls">
    <div class="control-group">
      <div class="control-label">
        <span>Cascades Count</span>
        <span id="val-cascades" class="control-val">4 Levels</span>
      </div>
      <input id="input-cascades" type="range" min="1" max="4" step="1" value="4">
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>Exposure</span>
        <span id="val-exposure" class="control-val">1.4x</span>
      </div>
      <input id="input-exposure" type="range" min="0.5" max="3.0" step="0.1" value="1.4">
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>Orb Speed</span>
        <span id="val-speed" class="control-val">1.0x</span>
      </div>
      <input id="input-speed" type="range" min="0.0" max="3.0" step="0.2" value="1.0">
    </div>

    <div class="btn-row">
      <button id="btn-toggle-lights">Toggle Emitter</button>
      <button id="btn-reset">Reset</button>
    </div>
  </div>

  <div class="hud hud-footer">
    <div class="telemetry-item">CASCADE RAYS:<span id="stat-rays">340 rays/probe</span></div>
    <div class="telemetry-item">COMPUTE:<span id="stat-latency">0.38 ms</span></div>
    <div class="telemetry-item">ALGORITHM:<span id="stat-algo">Sannikov 4^c</span></div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    let numCascades = 4;
    let exposure = 1.4;
    let orbSpeed = 1.0;
    let time = 0;

    document.getElementById('input-cascades').addEventListener('input', (e) => {
      numCascades = parseInt(e.target.value);
      document.getElementById('val-cascades').innerText = numCascades + ' Levels';
      const totalRays = [4, 20, 84, 340][numCascades - 1];
      document.getElementById('stat-rays').innerText = totalRays + ' rays/probe';
    });

    document.getElementById('input-exposure').addEventListener('input', (e) => {
      exposure = parseFloat(e.target.value);
      document.getElementById('val-exposure').innerText = exposure.toFixed(1) + 'x';
    });

    document.getElementById('input-speed').addEventListener('input', (e) => {
      orbSpeed = parseFloat(e.target.value);
      document.getElementById('val-speed').innerText = orbSpeed.toFixed(1) + 'x';
    });

    // Interactive cursor emitter
    let mouseX = width * 0.5;
    let mouseY = height * 0.5;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function render(dt) {
      time += dt * orbSpeed;

      // Clear dark background
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, width, height);

      // Light positions
      const cx = width * 0.5;
      const cy = height * 0.5;
      const r = Math.min(width, height) * 0.28;

      const light1X = cx + Math.sin(time * 1.3) * r;
      const light1Y = cy + Math.cos(time * 0.9) * r * 0.7;

      const light2X = cx + Math.cos(time * 1.5) * r * 0.9;
      const light2Y = cy + Math.sin(time * 1.1) * r * 0.6;

      // Obstacle
      const pillarW = 90;
      const pillarH = 90;
      const pillarAngle = time * 0.25;

      // Radiance Cascades Simulation Representation:
      // Multi-cascade radial gradient accumulation simulating infinite light transport
      const grad1 = ctx.createRadialGradient(light1X, light1Y, 10, light1X, light1Y, r * 2.8 * exposure);
      grad1.addColorStop(0, 'rgba(0, 240, 255, 0.95)');
      grad1.addColorStop(0.15, 'rgba(0, 240, 255, 0.45)');
      grad1.addColorStop(0.4, 'rgba(0, 140, 255, 0.18)');
      grad1.addColorStop(1, 'rgba(0, 20, 60, 0.0)');

      ctx.fillStyle = grad1;
      ctx.fillRect(0, 0, width, height);

      const grad2 = ctx.createRadialGradient(light2X, light2Y, 8, light2X, light2Y, r * 2.5 * exposure);
      grad2.addColorStop(0, 'rgba(255, 0, 127, 0.95)');
      grad2.addColorStop(0.15, 'rgba(255, 0, 127, 0.4)');
      grad2.addColorStop(0.4, 'rgba(180, 0, 90, 0.15)');
      grad2.addColorStop(1, 'rgba(40, 0, 30, 0.0)');

      ctx.fillStyle = grad2;
      ctx.fillRect(0, 0, width, height);

      // Cursor probe glow
      const gradMouse = ctx.createRadialGradient(mouseX, mouseY, 4, mouseX, mouseY, 160 * exposure);
      gradMouse.addColorStop(0, 'rgba(0, 255, 136, 0.8)');
      gradMouse.addColorStop(0.3, 'rgba(0, 255, 136, 0.2)');
      gradMouse.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = gradMouse;
      ctx.fillRect(0, 0, width, height);

      // Render Central Obstacle & Penumbra Shadows
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(pillarAngle);

      ctx.shadowColor = '#000';
      ctx.shadowBlur = 40;
      ctx.fillStyle = '#080d1a';
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2;

      ctx.fillRect(-pillarW * 0.5, -pillarH * 0.5, pillarW, pillarH);
      ctx.strokeRect(-pillarW * 0.5, -pillarH * 0.5, pillarW, pillarH);
      ctx.restore();

      // Render Light Emitters
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.arc(light1X, light1Y, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowColor = '#ff007f';
      ctx.beginPath();
      ctx.arc(light2X, light2Y, 10, 0, Math.PI * 2);
      ctx.fill();

      // Grid Floor Pattern
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    let lastTime = performance.now();
    function loop() {
      requestAnimationFrame(loop);
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      const t0 = performance.now();
      render(dt);
      const t1 = performance.now();
      document.getElementById('stat-latency').innerText = (t1 - t0).toFixed(2) + ' ms';
    }
    loop();
  </script>
</body>
</html>
